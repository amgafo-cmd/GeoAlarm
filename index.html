<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoAlarma – Alarma por ubicación</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f5f5f7; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-top: 0; font-size: 24px; }
        .status-badge { display: block; text-align: center; font-weight: bold; padding: 8px; background-color: #ffebee; color: #c62828; border-radius: 6px; margin-bottom: 15px; }
        .status-badge.active { background-color: #e8f5e9; color: #2e7d32; }
        
        /* Contenedor del mapa nativo con dimensiones estrictas aseguradas */
        .map-wrapper { width: 100%; height: 350px; margin-bottom: 15px; border-radius: 8px; overflow: hidden; background: #e5e5e5; position: relative; }
        #map-frame { width: 100%; height: 100%; border: none; display: block; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .radio-container { display: flex; align-items: center; gap: 10px; }
        .radio-container input { flex: 1; }
        .btn-container { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-activate { background-color: #4caf50; color: white; }
        .btn-activate:hover { background-color: #43a047; }
        .btn-stop { background-color: #f44336; color: white; }
        .btn-stop:hover { background-color: #e53935; }
        .btn-save { background-color: #ffb300; color: white; }
        .favorites { background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px dashed #ccc; }
        .fav-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📍 GeoAlarma</h1>
    <div id="status" class="status-badge">Inactivo</div>

    <!-- Buscador móvil optimizado para capturar cualquier botón de envío (Ir/Siguiente) -->
    <form id="search-form" class="control-group" action="#" onsubmit="return false;">
        <input type="text" id="search" placeholder="Escribe una ciudad o calle y pulsa Ir..." enterkeyhint="search">
    </form>

    <!-- Mapa Incrustado Nativo (Inmune a bloqueos de seguridad de GitHub) -->
    <div class="map-wrapper">
        <iframe id="map-frame" src="https://google.com"></iframe>
    </div>

    <p style="text-align: center; font-size: 14px; margin: 5px 0 15px 0; color: #666;">
        Destino fijado: <span id="destination-display" style="font-weight: bold; color: #007aff;">Madrid (Por defecto)</span>
    </p>

    <div class="control-group">
        <label>Definir radio de aviso:</label>
        <div class="radio-container">
            <input type="number" id="radius" value="10" min="5">
            <span>metros</span>
        </div>
    </div>

    <!-- CUADRO DE TEXTO LIBRE: Recordatorio -->
    <div class="control-group">
        <label for="reminder">Recordatorio al llegar:</label>
        <input type="text" id="reminder" placeholder="Ej: Comprar leche, bajar en la próxima parada...">
    </div>

    <div class="btn-container">
        <button class="btn-activate" id="btn-start">▶ Activar</button>
        <button class="btn-stop" id="btn-stop">⏹ Detener</button>
        <button class="btn-save" id="btn-save">⭐ Guardar</button>
    </div>

    <div class="favorites">
        <strong>Favoritos:</strong>
        <div id="favorites-list">
            <div style="color: #888; font-size: 12px; margin-top: 5px;">No tienes favoritos guardados aún.</div>
        </div>
    </div>
</div>
<script>
    let targetCoords = { lat: 40.416775, lon: -3.703790 }; // Coordenadas de Madrid por defecto
    let userCoords = null;
    let watchId = null;
    let audioContext = null;

    // Intentar obtener la ubicación inicial del usuario de forma segura
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
            // Centrar el mapa de forma nativa en la posición del usuario
            document.getElementById('map-frame').src = `https://google.com{userCoords.lat},${userCoords.lon}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
            document.getElementById('destination-display').innerText = "Tu ubicación actual";
            targetCoords = userCoords;
        }, () => {
            console.log("Acceso inicial al GPS denegado. Se mantiene la vista por defecto.");
        });
    }

    // LÓGICA DEL BUSCADOR INTEGRAL: Funciona al pulsar Enter, Ir o Siguiente en cualquier móvil
    document.getElementById('search-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const query = document.getElementById('search').value.trim();
        if (!query) return;

        // 1. Actualizar el mapa de forma inmediata incrustando la búsqueda segura
        document.getElementById('map-frame').src = `https://google.com{encodeURIComponent(query)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
        document.getElementById('destination-display').innerText = query;

        // 2. Obtener las coordenadas en segundo plano para el cálculo métrico de la alarma
        fetch(`https://openstreetmap.org{encodeURIComponent(query)}&limit=1`)
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    targetCoords = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
                }
            }).catch(err => console.log("Error al procesar métricas en segundo plano. Alarma usando aproximación visual."));
            
        document.getElementById('search').blur(); // Oculta el teclado virtual en smartphones
    });
    // Función matemática nativa Haversine para calcular distancias exactas en metros entre dos coordenadas (Sin librerías)
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // Radio de la Tierra en metros
        const phi1 = lat1 * Math.PI / 180;
        const phi2 = lat2 * Math.PI / 180;
        const deltaPhi = (lat2 - lat1) * Math.PI / 180;
        const deltaLambda = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                  Math.cos(phi1) * Math.cos(phi2) *
                  Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        return R * c; // Retorna la distancia exacta en metros
    }

    // Activación del rastreo perimetral continuo de la alarma
    document.getElementById('btn-start').addEventListener('click', () => {
        document.getElementById('status').innerText = "🚨 Alarma Activa";
        document.getElementById('status').className = "status-badge active";

        watchId = navigator.geolocation.watchPosition(position => {
            userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
            
            // Calcular la distancia métrica real hacia el destino
            const distanciaMetros = calcularDistancia(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
            const alarmRadius = parseInt(document.getElementById('radius').value) || 10;

            // Verificar si se ha ingresado al perímetro programado de 10 metros
            if (distanciaMetros <= alarmRadius) {
                activarAvisoAlarmante();
            }
        }, error => {
            console.error(error);
            alert("Para usar el rastreador en tiempo real, activa el GPS de tu móvil y concede permisos.");
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    });

    document.getElementById('btn-stop').addEventListener('click', detenerAlarma);

    function detenerAlarma() {
        if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        document.getElementById('status').innerText = "Inactivo";
        document.getElementById('status').className = "status-badge";
    }

    function activarAvisoAlarmante() {
        detenerAlarma();
        
        // Zumbador auditivo sintético nativo
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioContext.createOscillator();
            let gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.type = "sine"; osc.frequency.value = 880; osc.start();
            setTimeout(() => osc.stop(), 2500);
        } catch(e) {}

        // Ventana emergente con condicional inteligente para el recordatorio libre
        const mensajeRecordatorio = document.getElementById('reminder').value.trim();
        if (mensajeRecordatorio !== "") { 
            alert("🚨 ¡HAS LLEGADO AL DESTINO!\n\n📌 Recordatorio: " + mensajeRecordatorio); 
        } else { 
            alert("🚨 ¡HAS LLEGADO AL DESTINO!"); 
        }
    }

    // Guardar en favoritos en sesión local
    document.getElementById('btn-save').addEventListener('click', () => {
        const nombreFav = prompt("Escribe un nombre para este favorito:", "Mi Destino");
        if (nombreFav) {
            const list = document.getElementById('favorites-list');
            if (list.innerHTML.includes("No tienes favoritos")) list.innerHTML = "";
            const item = document.createElement('div');
            item.className = 'fav-item';
            item.innerHTML = `<span>⭐ ${nombreFav}</span> <small>Destino Programado</small>`;
            list.appendChild(item);
        }
    });
</script>
</body>
</html>
