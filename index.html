<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoAlarma – Alarma por ubicación con Google</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f5f5f7; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-top: 0; font-size: 24px; }
        .status-badge { display: block; text-align: center; font-weight: bold; padding: 8px; background-color: #ffebee; color: #c62828; border-radius: 6px; margin-bottom: 15px; }
        .status-badge.active { background-color: #e8f5e9; color: #2e7d32; }
        
        /* Contenedor oficial para el mapa de Google */
        #map { height: 350px !important; width: 100% !important; border-radius: 8px; margin-bottom: 15px; background: #e5e5e5; display: block; position: relative; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        /* Ajuste de diseño obligatorio para el autocompletado flotante de Google */
        .pac-container { border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); font-family: inherit; z-index: 9999 !important; }
        
        .radio-container { display: flex; align-items: center; gap: 10px; }
        .radio-container input { flex: 1; }
        .btn-container { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-activate { background-color: #4caf50; color: white; }
        .btn-activate:hover { background-color: #43a047; }
        .btn-stop { background-color: #f44336; color: white; }
        .btn-stop:hover { background-color: #e53935; }
        .btn-save { background-color: #ffb300; color: white; }
        .favorites { background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px dashed #ccc; }
        .fav-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer; color: #007aff; }
    </style>
</head>
<body>
<div class="container">
    <h1>📍 GeoAlarm</h1>
    <div id="status" class="status-badge">Inactivo</div>

    <!-- Barra de búsqueda enlazada al autocompletado inteligente de Google Places -->
    <div class="control-group">
        <input type="text" id="search" placeholder="Empieza a escribir una dirección...">
    </div>

    <!-- Lienzo del mapa oficial de Google -->
    <div id="map"></div>

    <p style="text-align: center; font-size: 14px; margin: 5px 0 15px 0; color: #666;">
        Distancia al destino: <span id="distance-display" style="font-weight: bold;">--</span> metros
    </p>

    <div class="control-group">
        <label>Definir radio de aviso:</label>
        <div class="radio-container">
            <input type="number" id="radius" value="10" min="5">
            <span>metros</span>
        </div>
    </div>

    <!-- CUADRO DE TEXTO LIBRE: Recordatorio personalizado -->
    <div class="control-group">
        <label for="reminder">Recordatorio al llegar:</label>
        <input type="text" id="reminder" placeholder="Ej: Comprar leche, bajar en la próxima parada...">
    </div>

    <div class="btn-container">
        <button class="btn-activate" id="btn-start">▶ Activar</button>
        <button class="btn-stop" id="btn-stop">⏹ Detener</button>
        <button class="btn-save" id="btn-save">⭐ Guardar</button>
    </div>

    <div class="favorites">
        <strong>Favoritos:</strong>
        <div id="favorites-list">
            <div style="color: #888; font-size: 12px; margin-top: 5px;">No tienes favoritos guardados aún.</div>
        </div>
    </div>
</div>
<!-- Librería oficial de mapas y sugerencias de Google Maps -->
<script src="https://googleapis.com"></script>

<script>
    let map, autocomplete, userMarker, targetMarker, distanceCircle;
    let userCoords = null;
    let targetCoords = null;
    let watchId = null;
    let audioContext = null;

    // Inicializar Google Maps centrado por defecto en una vista general de España
    function initApp() {
        const defaultCoords = { lat: 40.416775, lng: -3.703790 };
        map = new google.maps.Map(document.getElementById('map'), {
            center: defaultCoords,
            zoom: 13,
            disableDefaultUI: true,
            zoomControl: true
        });

        // Configurar el autocompletado en el cuadro de búsqueda
        const input = document.getElementById('search');
        autocomplete = new google.maps.places.Autocomplete(input);
        autocomplete.bindTo('bounds', map);

        // Evento cuando seleccionas una dirección sugerida por Google
        autocomplete.addListener('place_changed', () => {
            const place = autocomplete.getPlace();
            if (!place.geometry || !place.geometry.location) {
                return;
            }

            targetCoords = {
                lat: place.geometry.location.lat(),
                lng: place.geometry.location.lng()
            };

            // Mover el mapa y colocar el marcador rojo de destino
            map.setCenter(targetCoords);
            map.setZoom(16);

            if (targetMarker) targetMarker.setMap(null);
            targetMarker = new google.maps.Marker({
                position: targetCoords,
                map: map,
                icon: 'https://google.com'
            });

            actualizarCirculoYDistancia();
        });

        // Obtener la ubicación en tiempo real del usuario
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                userCoords = { lat: position.coords.latitude, lng: position.coords.longitude };
                map.setCenter(userCoords);
                
                userMarker = new google.maps.Marker({
                    position: userCoords,
                    map: map,
                    title: "Tu ubicación",
                    icon: 'https://google.com'
                });
            });
        }

        // Permitir elegir destino tocando directamente sobre Google Maps
        map.addListener('click', (e) => {
            targetCoords = { lat: e.latLng.lat(), lng: e.latLng.lng() };
            
            if (targetMarker) targetMarker.setMap(null);
            targetMarker = new google.maps.Marker({
                position: targetCoords,
                map: map,
                icon: 'https://google.com'
            });

            actualizarCirculoYDistancia();
        });
    }

    // Inicializar la aplicación al cargar la ventana
    window.addEventListener('load', initApp);
    function actualizarCirculoYDistancia() {
        const radiusVal = parseInt(document.getElementById('radius').value) || 10;
        
        if (distanceCircle) distanceCircle.setMap(null);
        if (targetCoords) {
            distanceCircle = new google.maps.Circle({
                strokeColor: '#4caf50',
                strokeOpacity: 0.8,
                strokeWeight: 2,
                fillColor: '#81c784',
                fillOpacity: 0.2,
                map: map,
                center: targetCoords,
                radius: radiusVal
            });
        }

        if (userCoords && targetCoords) {
            // Calcular distancia matemática exacta mediante la librería de Google
            const pUser = new google.maps.LatLng(userCoords.lat, userCoords.lng);
            const pTarget = new google.maps.LatLng(targetCoords.lat, targetCoords.lng);
            const dist = google.maps.geometry.spherical.computeDistanceBetween(pUser, pTarget);
            document.getElementById('distance-display').innerText = Math.round(dist);
        }
    }

    document.getElementById('radius').addEventListener('input', actualizarCirculoYDistancia);

    // Activación del rastreador perimetral de la alarma
    document.getElementById('btn-start').addEventListener('click', () => {
        if (!targetCoords) { alert("Busca una dirección o toca el mapa antes de activar la alarma."); return; }
        
        document.getElementById('status').innerText = "🚨 Alarma Activa";
        document.getElementById('status').className = "status-badge active";

        watchId = navigator.geolocation.watchPosition(position => {
            userCoords = { lat: position.coords.latitude, lng: position.coords.longitude };
            if (userMarker) userMarker.setPosition(userCoords);

            const pUser = new google.maps.LatLng(userCoords.lat, userCoords.lng);
            const pTarget = new google.maps.LatLng(targetCoords.lat, targetCoords.lng);
            const dist = google.maps.geometry.spherical.computeDistanceBetween(pUser, pTarget);
            document.getElementById('distance-display').innerText = Math.round(dist);

            const alarmRadius = parseInt(document.getElementById('radius').value) || 10;
            if (dist <= alarmRadius) { activarAvisoAlarmante(); }
        }, () => {
            alert("Por favor, activa el GPS de tu móvil para usar el rastreador.");
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    });

    document.getElementById('btn-stop').addEventListener('click', detenerAlarma);

    function detenerAlarma() {
        if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        document.getElementById('status').innerText = "Inactivo";
        document.getElementById('status').className = "status-badge";
    }

    function activarAvisoAlarmante() {
        detenerAlarma();
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioContext.createOscillator();
            let gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.type = "sine"; osc.frequency.value = 880; osc.start();
            setTimeout(() => osc.stop(), 2500);
        } catch(e) {}

        const mensajeRecordatorio = document.getElementById('reminder').value.trim();
        if (mensajeRecordatorio !== "") { 
            alert("🚨 ¡HAS LLEGADO AL DESTINO!\n\n📌 Recordatorio: " + mensajeRecordatorio); 
        } else { 
            alert("🚨 ¡HAS LLEGADO AL DESTINO!"); 
        }
    }

    // Almacenamiento en Favoritos
    document.getElementById('btn-save').addEventListener('click', () => {
        if (!targetCoords) return;
        const name = document.getElementById('search').value.trim() || "Destino Guardado";
        const list = document.getElementById('favorites-list');
        if (list.innerHTML.includes("No tienes favoritos")) list.innerHTML = "";
        const item = document.createElement('div');
        item.className = 'fav-item';
        item.innerHTML = `<span>⭐ ${name}</span>`;
        
        let guardadas = { ...targetCoords };
        item.onclick = () => {
            targetCoords = guardadas;
            document.getElementById('search').value = name;
            map.setCenter(targetCoords);
            if (targetMarker) targetMarker.setPosition(targetCoords);
            actualizarCirculoYDistancia();
        };
        list.appendChild(item);
    });
</script>
</body>
</html>
