<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoAlarma – 100% Autónoma y Portable</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f5f5f7; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-top: 0; font-size: 24px; }
        .status-badge { display: block; text-align: center; font-weight: bold; padding: 8px; background-color: #ffebee; color: #c62828; border-radius: 6px; margin-bottom: 15px; }
        .status-badge.active { background-color: #e8f5e9; color: #2e7d32; }
        
        /* Panel del Monitor Métrico Autónomo */
        .radar-panel { width: 100%; height: 200px; margin-bottom: 15px; background: #1c1c1e; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #30d158; border: 1px solid #2c2c2e; }
        .distancia-grande { font-size: 42px; font-weight: bold; font-family: monospace; margin: 10px 0; }
        .label-radar { font-size: 12px; color: #eaeaea; letter-spacing: 1px; text-transform: uppercase; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; background-color: white; }
        .radio-container { display: flex; align-items: center; gap: 10px; }
        .radio-container input { flex: 1; }
        .btn-container { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-activate { background-color: #34c759; color: white; }
        .btn-stop { background-color: #ff3b30; color: white; }
        .btn-save { background-color: #ff9500; color: white; }
        .favorites { background: #f2f2f7; padding: 12px; border-radius: 8px; border: 1px dashed #aeaeb2; }
        .fav-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e5e5ea; font-size: 14px; cursor: pointer; color: #007aff; font-weight: 500; }
        .fav-item:last-child { border: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>📍 GeoAlarm</h1>
    <div id="status" class="status-badge">Inactivo</div>

    <!-- Monitor Métrico Digital Inteligente -->
    <div class="radar-panel">
        <div class="label-radar">Distancia Restante</div>
        <div class="distancia-grande" id="dist-display">--</div>
        <div style="font-size: 13px; color: #8e8e93;">Objetivo: <span id="target-display" style="color:#ff9500; font-weight:bold;">Ninguno</span></div>
    </div>

    <!-- NUEVO: Selector de Destinos Preconfigurados sin depender de APIs externas -->
    <div class="control-group">
        <label for="city-selector">Seleccionar un destino predefinido:</label>
        <select id="city-selector">
            <option value="">-- Elige una ubicación o escribe abajo --</option>
            <option value="40.4167,-3.7037">Madrid (Km 0 - Puerta del Sol)</option>
            <option value="41.3851,2.1734">Barcelona (Plaza Cataluña)</option>
            <option value="39.4699,-0.3763">Valencia (Estación del Norte)</option>
            <option value="37.3891,-5.9845">Sevilla (Giralda)</option>
            <option value="41.6560,-0.8773">Zaragoza (Plaza del Pilar)</option>
            <option value="36.7212,-4.4214">Málaga (Calle Larios)</option>
            <option value="43.3623,-8.4115">La Coruña (Plaza de María Pita)</option>
        </select>
    </div>
    <!-- Caja para fijar coordenadas manuales personalizadas de cualquier lugar -->
    <div class="control-group">
        <label>O introduce coordenadas personalizadas (Latitud, Longitud):</label>
        <input type="text" id="coords-input" placeholder="Ej: 40.4321, -3.6899">
    </div>

    <div class="control-group">
        <label>Definir radio de aviso:</label>
        <div class="radio-container">
            <input type="number" id="radius" value="10" min="5">
            <span>metros</span>
        </div>
    </div>

    <!-- CUADRO DE TEXTO LIBRE: Recordatorio -->
    <div class="control-group">
        <label for="reminder">Recordatorio al llegar:</label>
        <input type="text" id="reminder" placeholder="Ej: Comprar leche, bajar en la próxima parada...">
    </div>

    <div class="btn-container">
        <button class="btn-activate" id="btn-start">▶ Activar Alarma</button>
        <button class="btn-stop" id="btn-stop">⏹ Detener</button>
        <button class="btn-save" id="btn-save">⭐ Guardar</button>
    </div>

    <div class="favorites">
        <strong>Tus ubicaciones guardadas:</strong>
        <div id="favorites-list">
            <div style="color: #888; font-size: 12px; margin-top: 5px;">No tienes favoritos guardados aún.</div>
        </div>
    </div>
</div>
<script>
    let targetCoords = null;
    let userCoords = null;
    let watchId = null;
    let audioContext = null;

    // Escuchar cambios en el selector desplegable de ciudades preconfiguradas
    document.getElementById('city-selector').addEventListener('change', function() {
        let val = this.value;
        if (val) {
            document.getElementById('coords-input').value = val;
            procesarCoordenadas(val);
        }
    });

    // Detectar si el usuario escribe coordenadas manuales en la caja de texto
    document.getElementById('coords-input').addEventListener('input', function() {
        procesarCoordenadas(this.value);
    });

    function procesarCoordenadas(texto) {
        let partes = texto.split(",");
        if (partes.length === 2) {
            let lat = parseFloat(partes[0].trim());
            let lon = parseFloat(partes[1].trim());
            if (!isNaN(lat) && !isNaN(lon)) {
                targetCoords = { lat: lat, lon: lon };
                document.getElementById('target-display').innerText = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                
                // Intenta actualizar la métrica en pantalla si el GPS ya detectó al usuario
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(position => {
                        userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
                        actualizarPantallaMetros();
                    });
                }
            }
        }
    }

    // Fórmula matemática pura Haversine para calcular distancias métricas sobre la Tierra (Independiente de servidores)
    function calcularMetros(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // Radio de la Tierra en metros
        const phi1 = lat1 * Math.PI / 180;
        const phi2 = lat2 * Math.PI / 180;
        const deltaPhi = (lat2 - lat1) * Math.PI / 180;
        const deltaLambda = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                  Math.cos(phi1) * Math.cos(phi2) *
                  Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function actualizarPantallaMetros() {
        if (!targetCoords || !userCoords) return;
        const m = calcularMetros(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
        if (m >= 1000) {
            document.getElementById('dist-display').innerText = (m / 1000).toFixed(2) + " km";
        } else {
            document.getElementById('dist-display').innerText = Math.round(m) + " m";
        }
    }

    // Activar el rastreo perimetral del GPS del dispositivo
    document.getElementById('btn-start').addEventListener('click', () => {
        if (!targetCoords) { alert("Por favor, introduce o selecciona un destino antes de activar la alarma."); return; }
        
        document.getElementById('status').innerText = "🚨 Alarma Activa";
        document.getElementById('status').className = "status-badge active";

        watchId = navigator.geolocation.watchPosition(position => {
            userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
            actualizarPantallaMetros();
            
            const m = calcularMetros(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
            const alarmRadius = parseInt(document.getElementById('radius').value) || 10;
            
            // Si el usuario entra al radio de la geocerca (ej: 10 metros), se dispara el aviso
            if (m <= alarmRadius) { dispararAlertaLlegada(); }
        }, () => {
            alert("Acceso al GPS denegado. Concede permisos de ubicación a tu navegador web.");
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    });

    document.getElementById('btn-stop').addEventListener('click', detenerAlarma);

    function detenerAlarma() {
        if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        document.getElementById('dist-display').innerText = "--";
        document.getElementById('status').innerText = "Inactivo";
        document.getElementById('status').className = "status-badge";
    }

    function dispararAlertaLlegada() {
        detenerAlarma();
        
        // Zumbador acústico nativo independiente de archivos de audio
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioContext.createOscillator();
            let gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.type = "sine"; osc.frequency.value = 880; osc.start();
            setTimeout(() => osc.stop(), 2500);
        } catch(e) {}

        // Ventana emergente con el recordatorio del cuadro de texto libre
        const mensajeRecordatorio = document.getElementById('reminder').value.trim();
        if (mensajeRecordatorio !== "") { 
            alert("🚨 ¡HAS LLEGADO AL DESTINO!\n\n📌 Recordatorio: " + mensajeRecordatorio); 
        } else { 
            alert("🚨 ¡HAS LLEGADO AL DESTINO!"); 
        }
    }

    // Guardar favoritos permanentes en la interfaz
    document.getElementById('btn-save').addEventListener('click', () => {
        if (!targetCoords) return;
        const nombreFav = prompt("Asigna un nombre a esta ubicación favorita:", "Mi Destino");
        if (nombreFav) {
            const list = document.getElementById('favorites-list');
            if (list.innerHTML.includes("No tienes favoritos")) list.innerHTML = "";
            const item = document.createElement('div');
            item.className = 'fav-item';
            item.innerHTML = `<span>⭐ ${nombreFav}</span> <small>${targetCoords.lat.toFixed(3)}, ${targetCoords.lon.toFixed(3)}</small>`;
            
            let coordsGuardadas = { ...targetCoords };
            item.onclick = () => {
                targetCoords = coordsGuardadas;
                document.getElementById('city-selector').value = "";
                document.getElementById('coords-input').value = `${targetCoords.lat}, ${targetCoords.lon}`;
                document.getElementById('target-display').innerText = `${targetCoords.lat.toFixed(4)}, ${targetCoords.lon.toFixed(4)}`;
                actualizarPantallaMetros();
            };
            list.appendChild(item);
        }
    });
</script>
</body>
</html>
