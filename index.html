<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoAlarma – Autonoma y Privada</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f5f5f7; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-top: 0; font-size: 24px; }
        .status-badge { display: block; text-align: center; font-weight: bold; padding: 8px; background-color: #ffebee; color: #c62828; border-radius: 6px; margin-bottom: 15px; }
        .status-badge.active { background-color: #e8f5e9; color: #2e7d32; }
        
        /* Contenedor del Mapa Táctil de Radar Vectorial Puro */
        .map-box { width: 100%; height: 320px; margin-bottom: 15px; background: #111; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
        #canvas-map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .radar-overlay { position: relative; z-index: 2; color: #30d158; text-align: center; font-family: monospace; font-size: 13px; background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 6px; pointer-events: none; border: 1px solid #222; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .radio-container { display: flex; align-items: center; gap: 10px; }
        .radio-container input { flex: 1; }
        .btn-container { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-activate { background-color: #34c759; color: white; }
        .btn-stop { background-color: #ff3b30; color: white; }
        .btn-save { background-color: #ff9500; color: white; }
        .favorites { background: #f2f2f7; padding: 12px; border-radius: 8px; border: 1px dashed #aeaeb2; }
        .fav-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e5e5ea; font-size: 14px; cursor: pointer; color: #007aff; }
    </style>
</head>
<body>
<div class="container">
    <h1>📍 GeoAlarm</h1>
    <div id="status" class="status-badge">Inactivo</div>

    <!-- Buscador de coordenadas o direcciones rápidas por texto libre -->
    <div class="control-group">
        <label>Buscar destino o fijar coordenadas manuales (Lat, Lon):</label>
        <input type="text" id="target-search" placeholder="Ej: 40.4167, -3.7037 o escribe un nombre...">
    </div>

    <!-- Mapa de Radar Vectorial Nativo en Pantalla (Inmune a Bloqueos) -->
    <div class="map-box" id="map-container">
        <canvas id="canvas-map"></canvas>
        <div class="radar-overlay">
            <div>DISTANCIA: <span id="dist-txt" style="font-weight:bold; font-size:16px;">--</span></div>
            <div style="margin-top:2px; font-size:11px; color:#aaa;">Rumbo: <span id="bearing-txt">0°</span></div>
        </div>
    </div>
    <div class="control-group">
        <label>Definir radio de aviso:</label>
        <div class="radio-container">
            <input type="number" id="radius" value="10" min="5">
            <span>metros</span>
        </div>
    </div>

    <!-- CUADRO DE TEXTO LIBRE: Recordatorio -->
    <div class="control-group">
        <label for="reminder">Recordatorio al llegar:</label>
        <input type="text" id="reminder" placeholder="Ej: Comprar leche, bajar en la próxima parada...">
    </div>

    <div class="btn-container">
        <button class="btn-activate" id="btn-start">▶ Activar Alarma</button>
        <button class="btn-stop" id="btn-stop">⏹ Detener</button>
        <button class="btn-save" id="btn-save">⭐ Guardar</button>
    </div>

    <div class="favorites">
        <strong>Ubicaciones favoritas:</strong>
        <div id="favorites-list">
            <div style="color: #888; font-size: 12px; margin-top: 5px;">No tienes favoritos guardados aún.</div>
        </div>
    </div>
</div>

<script>
    let userCoords = null, targetCoords = null, watchId = null, audioContext = null;
    let canvas, ctx, sweepAngle = 0;

    window.addEventListener('load', () => {
        canvas = document.getElementById('canvas-map');
        ctx = canvas.getContext('2d');
        resizeCanvas();
        animateMap();
        
        // Obtener ubicación GPS de partida inicial de forma automática
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
                updateMetrics();
            });
        }
    });

    function resizeCanvas() {
        if (canvas) {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
    }
    window.addEventListener('resize', resizeCanvas);

    // Dibuja el mapa táctil en tiempo real mediante geometría matemática nativa
    function animateMap() {
        if (!ctx || !canvas) return;
        ctx.fillStyle = '#111116';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let maxRadius = Math.min(cx, cy) - 15;
        
        // Círculos concéntricos de escala métrica
        ctx.strokeStyle = '#1d3b24';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 3; i++) {
            ctx.beginPath();
            ctx.arc(cx, cy, maxRadius * (i / 3), 0, Math.PI * 2);
            ctx.stroke();
        }
        
        // Líneas de cuadrícula de orientación (Norte, Sur, Este, Oeste)
        ctx.beginPath(); ctx.moveTo(cx - maxRadius, cy); ctx.lineTo(cx + maxRadius, cy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy - maxRadius); ctx.lineTo(cx, cy + maxRadius); ctx.stroke();
        
        // Indicador visual del punto de origen (Tu posición GPS real)
        ctx.fillStyle = '#007aff';
        ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
        
        // Si hay un objetivo seleccionado, se dibuja su vector métrico dinámico en pantalla
        if (userCoords && targetCoords) {
            let dist = haversine(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
            let bearing = getBearing(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
            let rad = (bearing - 90) * Math.PI / 180;
            
            let scaleDist = Math.min(dist / 100, 1); // Escala dinámica
            let tx = cx + maxRadius * scaleDist * Math.cos(rad);
            let ty = cy + maxRadius * scaleDist * Math.sin(rad);
            
            // Línea de rumbo hacia el objetivo
            ctx.strokeStyle = 'rgba(255, 149, 0, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tx, ty); ctx.stroke();
            
            // Marcador del Destino seleccionado
            ctx.fillStyle = '#ff9500';
            ctx.beginPath(); ctx.arc(tx, ty, 7, 0, Math.PI * 2); ctx.fill();
            
            // Círculo del perímetro de aviso configurado
            let alarmRadius = parseInt(document.getElementById('radius').value) || 10;
            ctx.strokeStyle = '#34c759';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(tx, ty, Math.max(alarmRadius / 5, 8), 0, Math.PI * 2); ctx.stroke();
        }
        
        // Haz de luz de barrido gráfico
        sweepAngle = (sweepAngle + 1.5) % 360;
        let sweepRad = (sweepAngle * Math.PI) / 180;
        ctx.strokeStyle = 'rgba(48, 209, 88, 0.15)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + maxRadius * Math.cos(sweepRad), cy + maxRadius * Math.sin(sweepRad)); ctx.stroke();
        
        requestAnimationFrame(animateMap);
    }
    // Toque táctil directo en la pantalla del radar para fijar un rumbo aproximado a ojo
    document.getElementById('map-container').addEventListener('click', (e) => {
        let rect = canvas.getBoundingClientRect();
        let x = e.clientX - rect.left - (canvas.width / 2);
        let y = e.clientY - rect.top - (canvas.height / 2);
        
        if (userCoords) {
            let angle = Math.atan2(y, x) * 180 / Math.PI + 90;
            // Genera una coordenada simulada a 50 metros en esa dirección
            let rLat = userCoords.lat + (y * 0.00001);
            let rLon = userCoords.lon + (x * 0.00001);
            targetCoords = { lat: rLat, lon: rLon };
            document.getElementById('target-search').value = `${rLat.toFixed(5)}, ${rLon.toFixed(5)}`;
            updateMetrics();
        }
    });

    // Procesador de la barra de texto (Acepta nombres o coordenadas Lat, Lon)
    document.getElementById('target-search').addEventListener('input', function() {
        let text = this.value.trim();
        let parts = text.split(",");
        if (parts.length === 2) {
            let lat = parseFloat(parts[0]);
            let lon = parseFloat(parts[1]);
            if (!isNaN(lat) && !isNaN(lon)) {
                targetCoords = { lat: lat, lon: lon };
                updateMetrics();
            }
        } else if (text.length > 3 && userCoords) {
            // Plan de contingencia asíncrono para búsquedas de texto plano
            fetch(`https://openstreetmap.org{encodeURIComponent(text)}&limit=1`, {
                headers: { 'User-Agent': 'GeoAlarmaNativaApp/1.0' }
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    targetCoords = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
                    updateMetrics();
                }
            }).catch(() => {});
        }
    });

    // Fórmulas matemáticas de navegación pura (Haversine y Rumbo)
    function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
        const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function getBearing(lat1, lon1, lat2, lon2) {
        let dLon = (lon2 - lon1) * Math.PI / 180;
        let lat1Rad = lat1 * Math.PI / 180, lat2Rad = lat2 * Math.PI / 180;
        let y = Math.sin(dLon) * Math.cos(lat2Rad);
        let x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
        return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function updateMetrics() {
        if (!userCoords || !targetCoords) return;
        let d = haversine(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
        let b = getBearing(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
        
        document.getElementById('dist-txt').innerText = d >= 1000 ? (d / 1000).toFixed(2) + " km" : Math.round(d) + " m";
        document.getElementById('bearing-txt').innerText = Math.round(b) + "°";
    }

    // Iniciar el sistema perimetral de monitoreo
    document.getElementById('btn-start').addEventListener('click', () => {
        if (!targetCoords) { alert("Define primero una ubicación escribiéndola o tocando la pantalla del radar."); return; }
        document.getElementById('status').innerText = "🚨 Alarma Activa";
        document.getElementById('status').className = "status-badge active";

        watchId = navigator.geolocation.watchPosition(position => {
            userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
            updateMetrics();
            
            let d = haversine(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
            let alarmRadius = parseInt(document.getElementById('radius').value) || 10;
            
            if (d <= alarmRadius) { triggerAlarm(); }
        }, () => { alert("GPS bloqueado. Concede permisos de ubicación."); }, 
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    });

    document.getElementById('btn-stop').addEventListener('click', stopTracking);

    function stopTracking() {
        if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        document.getElementById('status').innerText = "Inactivo";
        document.getElementById('status').className = "status-badge";
    }

    function triggerAlarm() {
        stopTracking();
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioContext.createOscillator();
            let gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.type = "sine"; osc.frequency.value = 880; osc.start();
            setTimeout(() => osc.stop(), 2500);
        } catch(e) {}

        const msg = document.getElementById('reminder').value.trim();
        alert(msg !== "" ? "🚨 ¡HAS LLEGADO AL DESTINO!\n\n📌 Recordatorio: " + msg : "🚨 ¡HAS LLEGADO AL DESTINO!");
    }

    // Guardar favoritos
    document.getElementById('btn-save').addEventListener('click', () => {
        if (!targetCoords) return;
        let name = document.getElementById('target-search').value.trim() || "Destino";
        let list = document.getElementById('favorites-list');
        if (list.innerHTML.includes("No tienes favoritos")) list.innerHTML = "";
        let item = document.createElement('div');
        item.className = 'fav-item';
        item.innerHTML = `<span>⭐ ${name.substring(0, 25)}</span>`;
        
        let cGuardadas = { ...targetCoords };
        item.onclick = () => {
            targetCoords = cGuardadas;
            document.getElementById('target-search').value = `${targetCoords.lat.toFixed(5)}, ${targetCoords.lon.toFixed(5)}`;
            updateMetrics();
        };
        list.appendChild(item);
    });
</script>
</body>
</html>
