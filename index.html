<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoAlarma – OpenStreetMap Nativo Garantizado</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f5f5f7; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-top: 0; font-size: 24px; }
        .status-badge { display: block; text-align: center; font-weight: bold; padding: 8px; background-color: #ffebee; color: #c62828; border-radius: 6px; margin-bottom: 15px; }
        .status-badge.active { background-color: #e8f5e9; color: #2e7d32; }
        
        /* Contenedor estricto del mapa inyectado */
        .map-wrapper { width: 100%; height: 350px; margin-bottom: 15px; border-radius: 8px; overflow: hidden; background: #e5e5e5; border: 1px solid #ddd; }
        #map-frame { width: 100%; height: 100%; border: none; display: block; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .search-container { display: flex; gap: 8px; }
        .search-container input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn-search { background-color: #007aff; color: white; width: auto; max-width: 600px; padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .radio-container { display: flex; align-items: center; gap: 10px; }
        .radio-container input { flex: 1; }
        .btn-container { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-activate { background-color: #34c759; color: white; }
        .btn-stop { background-color: #ff3b30; color: white; }
        .btn-save { background-color: #ff9500; color: white; }
        .favorites { background: #f2f2f7; padding: 12px; border-radius: 8px; border: 1px dashed #aeaeb2; }
        .fav-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e5ea; font-size: 14px; cursor: pointer; color: #007aff; }
    </style>
</head>
<body>
<div class="container">
    <h1>📍 GeoAlarma 1OSM</h1>
    <div id="status" class="status-badge">Inactivo</div>

    <!-- Formulario para interceptar los teclados virtuales móviles -->
    <form id="search-form" class="control-group" action="#" onsubmit="return false;">
        <label for="search">Buscar dirección en OpenStreetMap:</label>
        <div class="search-container">
            <input type="text" id="search" placeholder="Ej: Calle Roma 34 Madrid..." enterkeyhint="search">
            <button type="submit" class="btn-search">🔍 Buscar</button>
        </div>
    </form>

    <!-- MAPA INMUNE A BLOQUEOS: Marco incrustado nativo de OpenStreetMap -->
    <div class="map-wrapper">
        <iframe id="map-frame" src="https://openstreetmap.org"></iframe>
    </div>

    <p style="text-align: center; font-size: 14px; margin: 5px 0 15px 0; color: #666;">
        Destino Fijado: <span id="target-display" style="font-weight: bold; color: #007aff;">Madrid (Por defecto)</span>
    </p>
    <div class="control-group">
        <label>Definir radio de aviso:</label>
        <div class="radio-container">
            <input type="number" id="radius" value="10" min="5">
            <span>metros</span>
        </div>
    </div>

    <!-- CUADRO DE TEXTO LIBRE: Recordatorio -->
    <div class="control-group">
        <label for="reminder">Recordatorio al llegar:</label>
        <input type="text" id="reminder" placeholder="Ej: Comprar leche, bajar en la próxima parada...">
    </div>

    <div class="btn-container">
        <button class="btn-activate" id="btn-start">▶ Activar Alarma</button>
        <button class="btn-stop" id="btn-stop">⏹ Detener</button>
        <button class="btn-save" id="btn-save">⭐ Guardar</button>
    </div>

    <div class="favorites">
        <strong>Ubicaciones favoritas:</strong>
        <div id="favorites-list">
            <div style="color: #888; font-size: 12px; margin-top: 5px;">No tienes favoritos guardados aún.</div>
        </div>
    </div>
</div>
<script>
    let targetCoords = { lat: 40.4167, lon: -3.7037 }; // Madrid por defecto
    let userCoords = null;
    let watchId = null;
    let audioContext = null;

    // Intentar centrar el mapa al arrancar en la posición real del usuario si concede permisos
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
            targetCoords = userCoords;
            document.getElementById('target-display').innerText = "Tu ubicación actual";
            actualizarIframeMapa(userCoords.lat, userCoords.lon);
        });
    }

    function actualizarIframeMapa(lat, lon) {
        // Calcula una caja de visualización (delimitación) alrededor de las coordenadas
        let delta = 0.005;
        let bbox = `${lon - delta},${lat - delta},${lon + delta},${lat + delta}`;
        document.getElementById('map-frame').src = `https://openstreetmap.org{bbox}&layer=mapnik&marker=${lat},${lon}`;
    }

    // BUSCADOR ULTRA-COMPATIBLE: Procesa la dirección y refresca el marco del mapa al instante
    document.getElementById('search-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const query = document.getElementById('search').value.trim();
        if (!query) return;

        document.getElementById('target-display').innerText = "Buscando...";

        fetch(`https://openstreetmap.org{encodeURIComponent(query)}&limit=1`, {
            headers: { 'Accept': 'application/json', 'User-Agent': 'GeoAlarmaOSM_Iframe/1.0' }
        })
        .then(res => res.json())
        .then(data => {
            if (data && data.length > 0) {
                targetCoords = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
                document.getElementById('target-display').innerText = query;
                actualizarIframeMapa(targetCoords.lat, targetCoords.lon);
            } else {
                alert("No se encontró esa dirección. Intenta simplificar el texto.");
                document.getElementById('target-display').innerText = "Ninguno";
            }
        }).catch(err => {
            console.error(err);
            alert("Error temporal con el servidor de búsquedas.");
        });
        document.getElementById('search').blur();
    });

    // Fórmula matemática Haversine nativa para calcular distancias exactas en metros entre el GPS y el destino
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // Radio de la Tierra en metros
        const phi1 = lat1 * Math.PI / 180;
        const phi2 = lat2 * Math.PI / 180;
        const deltaPhi = (lat2 - lat1) * Math.PI / 180;
        const deltaLambda = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                  Math.cos(phi1) * Math.cos(phi2) *
                  Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // Activar geolocalización continua en tiempo real (Geofence)
    document.getElementById('btn-start').addEventListener('click', () => {
        if (!targetCoords) { alert("Busca una dirección antes de activar la alarma."); return; }
        
        document.getElementById('status').innerText = "🚨 Alarma Activa";
        document.getElementById('status').className = "status-badge active";

        watchId = navigator.geolocation.watchPosition(position => {
            userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
            
            const dist = calcularDistancia(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
            const alarmRadius = parseInt(document.getElementById('radius').value) || 10;

            if (dist <= alarmRadius) { activarAvisoAlarmante(); }
        }, () => { alert("GPS desactivado. Permite el rastreo en los ajustes de tu móvil."); }, 
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    });

    document.getElementById('btn-stop').addEventListener('click', detenerAlarma);

    function detenerAlarma() {
        if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        document.getElementById('status').innerText = "Inactivo";
        document.getElementById('status').className = "status-badge";
    }

    function activarAvisoAlarmante() {
        detenerAlarma();
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioContext.createOscillator();
            let gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.type = "sine"; osc.frequency.value = 880; osc.start();
            setTimeout(() => osc.stop(), 2500);
        } catch(e) {}

        const mensajeRecordatorio = document.getElementById('reminder').value.trim();
        alert(mensajeRecordatorio !== "" ? "🚨 ¡HAS LLEGADO AL DESTINO!\n\n📌 Recordatorio: " + mensajeRecordatorio : "🚨 ¡HAS LLEGADO AL DESTINO!");
    }

    // Guardar en favoritos de sesión local
    document.getElementById('btn-save').addEventListener('click', () => {
        if (!targetCoords) return;
        const name = document.getElementById('search').value.trim() || "Destino Guardado";
        const list = document.getElementById('favorites-list');
        if (list.innerHTML.includes("No tienes favoritos")) list.innerHTML = "";
        const item = document.createElement('div');
        item.className = 'fav-item';
        item.innerHTML = `<span>⭐ ${name}</span>`;
        
        let guardadas = { ...targetCoords };
        item.onclick = () => {
            targetCoords = guardadas;
            document.getElementById('search').value = name;
            document.getElementById('target-display').innerText = name;
            actualizarIframeMapa(targetCoords.lat, targetCoords.lon);
        };
        list.appendChild(item);
    });
</script>
</body>
</html>
