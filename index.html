<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoAlarma – Alarma por ubicación</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f5f5f7; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-top: 0; font-size: 24px; }
        .status-badge { display: block; text-align: center; font-weight: bold; padding: 8px; background-color: #ffebee; color: #c62828; border-radius: 6px; margin-bottom: 15px; }
        .status-badge.active { background-color: #e8f5e9; color: #2e7d32; }
        
        /* Contenedor del Radar Gráfico Nativo */
        .radar-box { width: 100%; height: 260px; margin-bottom: 15px; background: #111; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #radar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .radar-info { position: relative; z-index: 2; color: #00ff00; text-align: center; font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px; pointer-events: none; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .radio-container { display: flex; align-items: center; gap: 10px; }
        .radio-container input { flex: 1; }
        .btn-container { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-activate { background-color: #4caf50; color: white; }
        .btn-stop { background-color: #f44336; color: white; }
        .btn-save { background-color: #ffb300; color: white; }
        .favorites { background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px dashed #ccc; }
        .fav-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer; color: #007aff; }
    </style>
</head>
<body>
<div class="container">
    <h1>📍 GeoAlarma</h1>
    <div id="status" class="status-badge">Inactivo</div>

    <!-- Buscador Universal con Encabezado Seguro -->
    <form id="search-form" class="control-group" action="#" onsubmit="return false;">
        <input type="text" id="search" placeholder="Escribe el destino (ej: Madrid, Barcelona)..." enterkeyhint="search">
    </form>

    <!-- Radar Informativo en tiempo real -->
    <div class="radar-box">
        <canvas id="radar-canvas"></canvas>
        <div class="radar-info">
            <div>DISTANCIA: <span id="dist-val" style="font-weight:bold; font-size:18px;">--</span></div>
            <div style="margin-top:4px; font-size:11px; color:#aaa;">Objetivo: <span id="target-name">Ninguno</span></div>
        </div>
    </div>

    <div class="control-group">
        <label>Definir radio de aviso:</label>
        <div class="radio-container">
            <input type="number" id="radius" value="10" min="5">
            <span>metros</span>
        </div>
    </div>

    <!-- CUADRO DE TEXTO LIBRE: Recordatorio -->
    <div class="control-group">
        <label for="reminder">Recordatorio al llegar:</label>
        <input type="text" id="reminder" placeholder="Ej: Comprar leche, bajar en la próxima parada...">
    </div>

    <div class="btn-container">
        <button class="btn-activate" id="btn-start">▶ Activar</button>
        <button class="btn-stop" id="btn-stop">⏹ Detener</button>
        <button class="btn-save" id="btn-save">⭐ Guardar</button>
    </div>

    <div class="favorites">
        <strong>Favoritos:</strong>
        <div id="favorites-list">
            <div style="color: #888; font-size: 12px; margin-top: 5px;">No tienes favoritos guardados aún.</div>
        </div>
    </div>
</div>
<script>
    let targetCoords = null;
    let userCoords = null;
    let watchId = null;
    let audioContext = null;
    let canvas, ctx, animationFrame;

    window.addEventListener('load', () => {
        canvas = document.getElementById('radar-canvas');
        ctx = canvas.getContext('2d');
        ajustarCanvas();
        dibujarRadar(0);
    });

    function ajustarCanvas() {
        if (canvas) {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
    }
    window.addEventListener('resize', ajustarCanvas);

    function dibujarRadar(angulo) {
        if (!ctx || !canvas) return;
        ctx.fillStyle = 'rgba(17, 17, 17, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let r = Math.min(cx, cy) - 10;
        
        ctx.strokeStyle = '#005500';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, r * 0.6, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, r * 0.3, 0, Math.PI * 2); ctx.stroke();
        
        let targetAngulo = (angulo * Math.PI) / 180;
        ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + r * Math.cos(targetAngulo), cy + r * Math.sin(targetAngulo));
        ctx.stroke();
        
        animationFrame = requestAnimationFrame(() => dibujarRadar((angulo + 2) % 360));
    }

    // CORRECCIÓN DE PETICIÓN: Añade la cabecera User-Agent requerida para evitar errores de conexión (CORS/403)
    document.getElementById('search-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const query = document.getElementById('search').value.trim();
        if (!query) return;

        document.getElementById('target-name').innerText = "Buscando...";
        
        fetch(`https://openstreetmap.org{encodeURIComponent(query)}&limit=1`, {
            headers: {
                'User-Agent': 'GeoAlarmaPersonalApp/1.0 (contact: githubpages)'
            }
        })
        .then(res => {
            if (!res.ok) throw new Error("Respuesta de red denegada");
            return res.json();
        })
        .then(data => {
            if (data && data.length > 0) {
                targetCoords = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
                document.getElementById('target-name').innerText = query;
                calcularYMostrarDistancia();
            } else {
                alert("No se localizó ese destino. Prueba con una ciudad cercana.");
                document.getElementById('target-name').innerText = "Ninguno";
            }
        }).catch(err => {
            console.error(err);
            // Plan de contingencia por coordenadas manuales si falla la red
            let manual = prompt("Error de red con el servidor de mapas. Si conoces las coordenadas, colócalas (Latitud, Longitud):", "40.4167, -3.7037");
            if (manual) {
                let partes = manual.split(",");
                if (partes.length === 2) {
                    targetCoords = { lat: parseFloat(partes[0].trim()), lon: parseFloat(partes[1].trim()) };
                    document.getElementById('target-name').innerText = "Coordenadas manuales";
                    calcularYMostrarDistancia();
                }
            } else {
                document.getElementById('target-name').innerText = "Ninguno";
            }
        });
            
        document.getElementById('search').blur();
    });
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3; 
        const p1 = lat1 * Math.PI / 180;
        const p2 = lat2 * Math.PI / 180;
        const dPhi = (lat2 - lat1) * Math.PI / 180;
        const dLam = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dPhi / 2) * Math.sin(dPhi / 2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dLam / 2) * Math.sin(dLam / 2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function calcularYMostrarDistancia() {
        if (!targetCoords) return;
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
                const metros = calcularDistancia(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
                if (metros >= 1000) { document.getElementById('dist-val').innerText = (metros / 1000).toFixed(2) + " km"; } 
                else { document.getElementById('dist-val').innerText = Math.round(metros) + " m"; }
            });
        }
    }

    document.getElementById('btn-start').addEventListener('click', () => {
        if (!targetCoords) { alert("Primero busca o define un destino en la caja de arriba."); return; }
        document.getElementById('status').innerText = "🚨 Alarma Activa";
        document.getElementById('status').className = "status-badge active";

        watchId = navigator.geolocation.watchPosition(position => {
            userCoords = { lat: position.coords.latitude, lon: position.coords.longitude };
            const metros = calcularDistancia(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
            
            if (metros >= 1000) { document.getElementById('dist-val').innerText = (metros / 1000).toFixed(2) + " km"; } 
            else { document.getElementById('dist-val').innerText = Math.round(metros) + " m"; }

            const alarmRadius = parseInt(document.getElementById('radius').value) || 10;
            if (metros <= alarmRadius) { activarAvisoAlarmante(); }
        }, () => {
            alert("Activa el GPS de tu teléfono móvil y concede permisos de ubicación.");
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    });

    document.getElementById('btn-stop').addEventListener('click', detenerAlarma);

    function detenerAlarma() {
        if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        document.getElementById('status').innerText = "Inactivo";
        document.getElementById('status').className = "status-badge";
    }

    function activarAvisoAlarmante() {
        detenerAlarma();
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioContext.createOscillator();
            let gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.type = "sine"; osc.frequency.value = 880; osc.start();
            setTimeout(() => osc.stop(), 2500);
        } catch(e) {}

        const mensajeRecordatorio = document.getElementById('reminder').value.trim();
        if (mensajeRecordatorio !== "") { alert("🚨 ¡HAS LLEGADO AL DESTINO!\n\n📌 Recordatorio: " + mensajeRecordatorio); } 
        else { alert("🚨 ¡HAS LLEGADO AL DESTINO!"); }
    }

    document.getElementById('btn-save').addEventListener('click', () => {
        if (!targetCoords) return;
        const name = document.getElementById('search').value.trim() || "Destino";
        const list = document.getElementById('favorites-list');
        if (list.innerHTML.includes("No tienes favoritos")) list.innerHTML = "";
        const item = document.createElement('div');
        item.className = 'fav-item';
        item.innerHTML = `<span>⭐ ${name}</span>`;
        
        let guardadas = { ...targetCoords };
        item.onclick = () => {
            targetCoords = guardadas;
            document.getElementById('search').value = name;
            document.getElementById('target-name').innerText = name;
            calcularYMostrarDistancia();
        };
        list.appendChild(item);
    });
</script>
</body>
</html>
