<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoAlarma – OpenStreetMap Gratis</title>
    <!-- Estilos oficiales de OpenStreetMap para que el mapa no se descuadre -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f5f5f7; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-top: 0; font-size: 24px; }
        .status-badge { display: block; text-align: center; font-weight: bold; padding: 8px; background-color: #ffebee; color: #c62828; border-radius: 6px; margin-bottom: 15px; }
        .status-badge.active { background-color: #e8f5e9; color: #2e7d32; }
        
        /* Caja del mapa con dimensiones fijas obligatorias para evitar que salga invisible */
        #map { height: 350px !important; width: 100% !important; border-radius: 8px; margin-bottom: 15px; background: #e5e5e5; display: block; position: relative; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .radio-container { display: flex; align-items: center; gap: 10px; }
        .radio-container input { flex: 1; }
        .btn-container { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-activate { background-color: #34c759; color: white; }
        .btn-stop { background-color: #ff3b30; color: white; }
        .btn-save { background-color: #ff9500; color: white; }
        .favorites { background: #f2f2f7; padding: 12px; border-radius: 8px; border: 1px dashed #aeaeb2; }
        .fav-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e5ea; font-size: 14px; cursor: pointer; color: #007aff; }
    </style>
</head>
<body>
<div class="container">
    <h1>📍 GeoAlarma OSM</h1>
    <div id="status" class="status-badge">Inactivo</div>

    <!-- Buscador universal adaptado a teclados móviles (Ir/Siguiente) -->
    <form id="search-form" class="control-group" action="#" onsubmit="return false;">
        <input type="text" id="search" placeholder="Escribe calle, ciudad o lugar y pulsa Ir..." enterkeyhint="search">
    </form>

    <div id="map"></div>

    <p style="text-align: center; font-size: 14px; margin: 5px 0 15px 0; color: #666;">
        Distancia al destino: <span id="distance-display" style="font-weight: bold;">--</span> metros
    </p>
    <div class="control-group">
        <label>Definir radio de aviso:</label>
        <div class="radio-container">
            <input type="number" id="radius" value="10" min="5">
            <span>metros</span>
        </div>
    </div>

    <!-- CUADRO DE TEXTO LIBRE: Recordatorio -->
    <div class="control-group">
        <label for="reminder">Recordatorio al llegar:</label>
        <input type="text" id="reminder" placeholder="Ej: Comprar leche, bajar en la próxima parada...">
    </div>

    <div class="btn-container">
        <button class="btn-activate" id="btn-start">▶ Activar Alarma</button>
        <button class="btn-stop" id="btn-stop">⏹ Detener</button>
        <button class="btn-save" id="btn-save">⭐ Guardar</button>
    </div>

    <div class="favorites">
        <strong>Favoritos rápidos:</strong>
        <div id="favorites-list">
            <div style="color: #888; font-size: 12px; margin-top: 5px;">No tienes favoritos guardados aún.</div>
        </div>
    </div>
</div>

<!-- Cargamos el motor de OpenStreetMap con seguridad HTTPS obligatoria -->
<script src="https://cloudflare.com"></script>

<script>
    let map, userMarker, targetMarker, distanceCircle;
    let userCoords = null, targetCoords = null, watchId = null, audioContext = null;

    // Inicializar mapa de OpenStreetMap centrado por defecto en Madrid
    map = L.map('map', { zoomControl: true }).setView([40.4167, -3.7037], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // FIX ANTIBLOQUEO: Fuerza al mapa a renderizarse visualmente pase lo que pase
    const observer = new ResizeObserver(() => { if (map) map.invalidateSize(); });
    observer.observe(document.getElementById("map"));

    // Intentar ubicar al usuario al arrancar de forma segura
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            userCoords = [position.coords.latitude, position.coords.longitude];
            map.setView(userCoords, 15);
            userMarker = L.marker(userCoords).addTo(map).bindPopup("Estás aquí").openPopup();
            map.invalidateSize();
        }, () => { map.invalidateSize(); });
    }

    // BUSCADOR ADAPTADO: Usa un desvío de servidor para saltarse el error de conexión en móviles
    document.getElementById('search-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const query = document.getElementById('search').value.trim();
        if (!query) return;

        // Buscador OpenStreetMap libre optimizado para evitar bloqueos por CORS o identidad
        fetch(`https://openstreetmap.org{encodeURIComponent(query)}&limit=1`, {
            headers: { 'Accept': 'application/json', 'User-Agent': 'GeoAlarmaGratisOSM/1.0' }
        })
        .then(res => res.json())
        .then(data => {
            if (data && data.length > 0) {
                targetCoords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                map.setView(targetCoords, 16);
                
                if (targetMarker) targetMarker.setLatLng(targetCoords);
                else targetMarker = L.marker(targetCoords, { draggable: false }).addTo(map);
                
                targetMarker.bindPopup(`<b>Destino:</b><br>${query}`).openPopup();
                actualizarCirculoYDistancia();
                document.getElementById('search').blur(); // Oculta el teclado móvil
            } else { alert("Lugar no encontrado."); }
        }).catch(() => { alert("Error al conectar temporalmente con el servidor. Intenta tocar el mapa con el dedo."); });
    });
    // También permite fijar el destino dando un toque directo en la pantalla sobre el mapa
    map.on('click', function(e) {
        targetCoords = [e.latlng.lat, e.latlng.lng];
        if (targetMarker) targetMarker.setLatLng(targetCoords).bindPopup("Destino fijado").openPopup();
        else targetMarker = L.marker(targetCoords).addTo(map).bindPopup("Destino fijado").openPopup();
        actualizarCirculoYDistancia();
    });

    function actualizarCirculoYDistancia() {
        const radiusVal = parseInt(document.getElementById('radius').value) || 10;
        if (distanceCircle) map.removeLayer(distanceCircle);
        if (targetCoords) {
            distanceCircle = L.circle(targetCoords, { color: '#34c759', fillColor: '#34c759', fillOpacity: 0.15, radius: radiusVal }).addTo(map);
        }
        if (userCoords && targetCoords) {
            const dist = map.distance(userCoords, targetCoords);
            document.getElementById('distance-display').innerText = Math.round(dist);
        }
    }
    document.getElementById('radius').addEventListener('input', actualizarCirculoYDistancia);

    // Iniciar rastreador métrico continuo (Geofencing)
    document.getElementById('btn-start').addEventListener('click', () => {
        if (!targetCoords) { alert("Elige un destino tocando el mapa o buscándolo arriba."); return; }
        
        document.getElementById('status').innerText = "🚨 Alarma Activa";
        document.getElementById('status').className = "status-badge active";

        watchId = navigator.geolocation.watchPosition(position => {
            userCoords = [position.coords.latitude, position.coords.longitude];
            if (userMarker) userMarker.setLatLng(userCoords);

            const dist = map.distance(userCoords, targetCoords);
            document.getElementById('distance-display').innerText = Math.round(dist);

            const alarmRadius = parseInt(document.getElementById('radius').value) || 10;
            if (dist <= alarmRadius) { activarAvisoAlarmante(); }
        }, () => { alert("GPS denegado. Concede permisos en los ajustes de tu móvil."); }, 
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    });

    document.getElementById('btn-stop').addEventListener('click', detenerAlarma);

    function detenerAlarma() {
        if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        document.getElementById('status').innerText = "Inactivo";
        document.getElementById('status').className = "status-badge";
    }

    function activarAvisoAlarmante() {
        detenerAlarma();
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioContext.createOscillator();
            let gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.type = "sine"; osc.frequency.value = 880; osc.start();
            setTimeout(() => osc.stop(), 2500);
        } catch(e) {}

        // Ventana emergente con el recordatorio del cuadro de texto libre
        const mensajeRecordatorio = document.getElementById('reminder').value.trim();
        if (mensajeRecordatorio !== "") { 
            alert("🚨 ¡HAS LLEGADO AL DESTINO!\n\n📌 Recordatorio: " + mensajeRecordatorio); 
        } else { 
            alert("🚨 ¡HAS LLEGADO AL DESTINO!"); 
        }
    }

    // Favoritos
    document.getElementById('btn-save').addEventListener('click', () => {
        if (!targetCoords) return;
        const name = document.getElementById('search').value.trim() || "Destino Guardado";
        const list = document.getElementById('favorites-list');
        if (list.innerHTML.includes("No tienes favoritos")) list.innerHTML = "";
        const item = document.createElement('div');
        item.className = 'fav-item';
        item.innerHTML = `<span>⭐ ${name}</span>`;
        
        let guardadas = [...targetCoords];
        item.onclick = () => {
            targetCoords = guardadas;
            document.getElementById('search').value = name;
            map.setView(targetCoords, 16);
            if (targetMarker) targetMarker.setLatLng(targetCoords);
            actualizarCirculoYDistancia();
        };
        list.appendChild(item);
    });
</script>
</body>
</html>
