<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoAlarma – OpenStreetMap 100% Reparado</title>
    
    <!-- 1. CARGA PRIORITARIA: Estilos oficiales de Leaflet -->
    <link rel="stylesheet" href="https://cloudflare.com" crossorigin="anonymous" />
    
    <!-- 2. CARGA PRIORITARIA: Motor JavaScript oficial de Leaflet -->
    <script src="https://cloudflare.com" crossorigin="anonymous"></script>

    <!-- 3. Estilos nativos incrustados para blindar el tamaño físico del mapa -->
    <style>
        .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-map-pane svg,.leaflet-map-pane canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}.leaflet-container{overflow:hidden;-ms-touch-action:none;touch-action:none;cursor:default;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-drag:none;user-select:none;-webkit-user-select:none}.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}.leaflet-vml-shape{width:1px;height:1px}.lvml{behavior:url(#default#VML);display:inline-block;position:absolute}.leaflet-control{position:relative;z-index:800;pointer-events:auto}.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-control{float:left;clear:both}.leaflet-right .leaflet-control{float:right}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}.leaflet-fade-anim .leaflet-tile{opacity:0;-webkit-transition:opacity .2s linear;-moz-transition:opacity .2s linear;transition:opacity .2s linear}.leaflet-fade-anim .leaflet-tile-loaded{opacity:1}.leaflet-zoom-animated{-webkit-transform-origin:0 0;-ms-transform-origin:0 0;transform-origin:0 0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:15px;background-color:#f5f5f7;color:#333}.container{max-width:600px;margin:0 auto;background:white;padding:20px;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,0.1)}h1{text-align:center;margin-top:0;font-size:24px}.status-badge{display:block;text-align:center;font-weight:bold;padding:8px;background-color:#ffebee;color:#c62828;border-radius:6px;margin-bottom:15px}.status-badge.active{background-color:#e8f5e9;color:#2e7d32}
        
        /* Contenedor del mapa forzado con dimensiones fijas estrictas */
        #map { height: 350px !important; width: 100% !important; border-radius: 8px; margin-bottom: 15px; background: #e5e5e5; display: block; position: relative; z-index: 1; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .search-container { display: flex; gap: 8px; }
        .search-container input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn-search { background-color: #007aff; color: white; width: auto; max-width: 600px; padding: 10px 15px; }
        input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .radio-container { display: flex; align-items: center; gap: 10px; }
        .radio-container input { flex: 1; }
        .btn-container { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-activate { background-color: #34c759; color: white; }
        .btn-stop { background-color: #ff3b30; color: white; }
        .btn-save { background-color: #ff9500; color: white; }
        .favorites { background: #f2f2f7; padding: 12px; border-radius: 8px; border: 1px dashed #aeaeb2; }
        .fav-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e5ea; font-size: 14px; cursor: pointer; color: #007aff; }
    </style>
</head>
<body>
<div class="container">
    <h1>📍 GeoAlarm</h1>
    <div id="status" class="status-badge">Inactivo</div>

    <!-- Formulario estructurado para capturar los teclados móviles -->
    <form id="search-form" class="control-group" action="#" onsubmit="return false;">
        <label for="search">Buscar dirección en OpenStreetMap:</label>
        <div class="search-container">
            <input type="text" id="search" placeholder="Ej: Calle Roma 34 Madrid..." enterkeyhint="search">
            <button type="submit" class="btn-search">🔍 Buscar</button>
        </div>
    </form>

    <!-- El lienzo físico del mapa -->
    <div id="map"></div>

    <p style="text-align: center; font-size: 14px; margin: 5px 0 15px 0; color: #666;">
        Distancia al destino: <span id="distance-display" style="font-weight: bold;">--</span> metros
    </p>

    <div class="control-group">
        <label>Definir radio de aviso:</label>
        <div class="radio-container">
            <input type="number" id="radius" value="10" min="5">
            <span>metros</span>
        </div>
    </div>

    <!-- CUADRO DE TEXTO LIBRE: Recordatorio -->
    <div class="control-group">
        <label for="reminder">Recordatorio al llegar:</label>
        <input type="text" id="reminder" placeholder="Ej: Comprar leche, bajar en la próxima parada...">
    </div>

    <div class="btn-container">
        <button class="btn-activate" id="btn-start">▶ Activar Alarma</button>
        <button class="btn-stop" id="btn-stop">⏹ Detener</button>
        <button class="btn-save" id="btn-save">⭐ Guardar</button>
    </div>

    <div class="favorites">
        <strong>Ubicaciones favoritas:</strong>
        <div id="favorites-list">
            <div style="color: #888; font-size: 12px; margin-top: 5px;">No tienes favoritos guardados aún.</div>
        </div>
    </div>
</div>
<script>
    let map, userMarker, targetMarker, distanceCircle;
    let userCoords = null, targetCoords = null, watchId = null, audioContext = null;

    // Inicializar el mapa de OpenStreetMap de forma nativa e inmediata (Seguro al estar 'L' ya cargada arriba)
    map = L.map('map', { zoomControl: true }).setView([40.4167, -3.7037], 13);
    
    // Servidor de imágenes directo e independiente de OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Redibujado de seguridad visual instantáneo
    setTimeout(() => { map.invalidateSize(); }, 200);

    // Obtener la ubicación GPS en tiempo real
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            userCoords = [position.coords.latitude, position.coords.longitude];
            map.setView(userCoords, 15);
            userMarker = L.marker(userCoords).addTo(map).bindPopup("Estás aquí").openPopup();
            map.invalidateSize();
        }, () => { map.invalidateSize(); });
    }

    // Buscador conectado a OpenStreetMap con lectura de datos verificada []
    document.getElementById('search-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const query = document.getElementById('search').value.trim();
        if (!query) return;

        fetch(`https://openstreetmap.org{encodeURIComponent(query)}&limit=1`, {
            headers: { 'Accept': 'application/json', 'User-Agent': 'GeoAlarmaOSM_Final/5.0' }
        })
        .then(res => res.json())
        .then(data => {
            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);
                targetCoords = [lat, lon];
                
                map.setView(targetCoords, 16);
                
                if (targetMarker) targetMarker.setLatLng(targetCoords);
                else targetMarker = L.marker(targetCoords).addTo(map);
                
                targetMarker.bindPopup(`<b>Destino:</b><br>${data[0].display_name}`).openPopup();
                actualizarCirculoYDistancia();
            } else {
                alert("No se encontró esa dirección. Intenta simplificar el texto.");
            }
        }).catch(err => {
            console.error(err);
            alert("Error de conexión. Puedes marcar tu destino dando un toque directo en el mapa.");
        });
        document.getElementById('search').blur();
    });

    // Permitir elegir destino manual dando un toque en la pantalla sobre el mapa
    map.on('click', function(e) {
        targetCoords = [e.latlng.lat, e.latlng.lng];
        if (targetMarker) targetMarker.setLatLng(targetCoords).bindPopup("Destino seleccionado").openPopup();
        else targetMarker = L.marker(targetCoords).addTo(map).bindPopup("Destino seleccionado").openPopup();
        actualizarCirculoYDistancia();
    });

    function actualizarCirculoYDistancia() {
        const radiusVal = parseInt(document.getElementById('radius').value) || 10;
        if (distanceCircle) map.removeLayer(distanceCircle);
        if (targetCoords) {
            distanceCircle = L.circle(targetCoords, { color: '#34c759', fillColor: '#34c759', fillOpacity: 0.15, radius: radiusVal }).addTo(map);
        }
        if (userCoords && targetCoords) {
            const dist = map.distance(userCoords, targetCoords);
            document.getElementById('distance-display').innerText = Math.round(dist);
        }
    }
    document.getElementById('radius').addEventListener('input', actualizarCirculoYDistancia);

    // Alarma continua perimetral
    document.getElementById('btn-start').addEventListener('click', () => {
        if (!targetCoords) { alert("Elige un destino en el mapa o búscalo arriba antes de empezar."); return; }
        
        document.getElementById('status').innerText = "🚨 Alarma Activa";
        document.getElementById('status').className = "status-badge active";

        watchId = navigator.geolocation.watchPosition(position => {
            userCoords = [position.coords.latitude, position.coords.longitude];
            if (userMarker) userMarker.setLatLng(userCoords);

            const dist = map.distance(userCoords, targetCoords);
            document.getElementById('distance-display').innerText = Math.round(dist);

            const alarmRadius = parseInt(document.getElementById('radius').value) || 10;
            if (dist <= alarmRadius) { activarAvisoAlarmante(); }
        }, () => { alert("GPS desactivado. Permite el rastreo en los ajustes de tu móvil."); }, 
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    });

    document.getElementById('btn-stop').addEventListener('click', detenerAlarma);

    function detenerAlarma() {
        if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        document.getElementById('status').innerText = "Inactivo";
        document.getElementById('status').className = "status-badge";
    }

    function activarAvisoAlarmante() {
        detenerAlarma();
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioContext.createOscillator();
            let gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.type = "sine"; osc.frequency.value = 880; osc.start();
            setTimeout(() => osc.stop(), 2500);
        } catch(e) {}

        const mensajeRecordatorio = document.getElementById('reminder').value.trim();
        if (mensajeRecordatorio !== "") { 
            alert("🚨 ¡HAS LLEGADO AL DESTINO!\n\n📌 Recordatorio: " + mensajeRecordatorio); 
        } else { 
            alert("🚨 ¡HAS LLEGADO AL DESTINO!"); 
        }
    }

    // Guardar favoritos
    document.getElementById('btn-save').addEventListener('click', () => {
        if (!targetCoords) return;
        const name = document.getElementById('search').value.trim() || "Destino Guardado";
        const list = document.getElementById('favorites-list');
        if (list.innerHTML.includes("No tienes favoritos")) list.innerHTML = "";
        const item = document.createElement('div');
        item.className = 'fav-item';
        item.innerHTML = `<span>⭐ ${name}</span>`;
        
        let guardadas = [...targetCoords];
        item.onclick = () => {
            targetCoords = guardadas;
            document.getElementById('search').value = name;
            map.setView(targetCoords, 16);
            if (targetMarker) targetMarker.setLatLng(targetCoords);
            actualizarCirculoYDistancia();
        };
        list.appendChild(item);
    });
</script>
</body>
</html>
